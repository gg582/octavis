<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' blob: data:; script-src 'self' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self' blob: data:; font-src 'self'; object-src 'none'; base-uri 'self';" />
    <meta name="referrer" content="no-referrer" />
    <title>OctaVis - Optical Data Codec (Chameleon Camouflage v1.1)</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1>OctaVis (v1.1)</h1>
        <p class="subtitle">60셀 육각 격자 (10,621칸) · 카멜레온 가변 프리앰블 & 위장형 격자 탑재</p>
        <div class="security-badge">
          🛡️ <strong>검열 저항성 극대화:</strong> 패스프레이즈 기반 카멜레온 프리앰블(시그니처 무작위화) + 사이버펑크 레이더 위장 배경 지원
        </div>
      </header>

      <main class="container">
        <!-- Encoder Section -->
        <section class="panel">
          <h2>인코더 (Encoder)</h2>
          <div class="control-group">
            <label for="file-input">전송할 파일 선택</label>
            <input type="file" id="file-input" />
          </div>
          <div class="control-group">
            <label for="text-input">또는 텍스트 직접 입력</label>
            <textarea id="text-input" rows="3" placeholder="인코딩할 텍스트 입력..."></textarea>
          </div>
          <div class="control-group">
            <label for="enc-passphrase">비밀 키 / 패스프레이즈 (암호화 및 카멜레온 프리앰블 시드)</label>
            <input type="password" id="enc-passphrase" placeholder="비우면 기본 마젠타, 입력 시 프리앰블 색상 가변화 & ChaCha20 암호화" />
          </div>
          <div class="control-group row">
            <label>
              <input type="radio" name="mode" value="static" checked /> 정적 이미지 (PNG)
            </label>
            <label>
              <input type="radio" name="mode" value="video" /> 비디오 스트림 (WebM)
            </label>
            <label>
              <input type="checkbox" id="camouflage-mode" /> 위장형 그래픽 모드 (게임/레이더 UI 위장)
            </label>
          </div>
          <button id="encode-btn" class="btn primary">인코드 생성</button>

          <div id="encode-status" class="status-box"></div>
          <div class="preview-box">
            <canvas id="encode-canvas"></canvas>
            <video id="encode-video" controls style="display: none;"></video>
          </div>
          <div class="action-row">
            <a id="download-btn" class="btn secondary" style="display: none;">다운로드</a>
          </div>
        </section>

        <!-- Decoder Section -->
        <section class="panel">
          <h2>디코더 (Decoder)</h2>
          
          <div class="control-group">
            <label><strong>방법 1: 정적 이미지 / 비디오 파일 첨부 (직접 수신)</strong></label>
            <p class="hint">카메라 촬영 없이 .png, .webp 또는 .webm 비디오 파일을 직접 넣어 즉시 복원합니다.</p>
            <input type="file" id="decode-file-input" accept="image/*,video/webm" />
          </div>

          <div class="divider">또는</div>

          <div class="control-group">
            <label><strong>방법 2: 실시간 카메라 스캔</strong></label>
            <button id="cam-toggle-btn" class="btn secondary">웹캠 스캐너 시작 / 정지</button>
          </div>

          <div class="preview-box">
            <video id="cam-video" playsinline style="display: none;"></video>
            <canvas id="cam-canvas" style="display: none;"></canvas>
          </div>

          <div class="control-group">
            <label for="dec-passphrase">복호화 비밀 키 / 패스프레이즈 (암호화 및 가변 프리앰블 수신 시 필수)</label>
            <input type="password" id="dec-passphrase" placeholder="인코더에서 설정한 패스프레이즈 입력" />
          </div>

          <div id="decode-status" class="status-box"></div>
          <div class="control-group">
            <label>복원된 데이터 (오프라인 메모리 내 유지)</label>
            <textarea id="decode-output" rows="6" readonly placeholder="디코딩 결과가 여기에 표시됩니다."></textarea>
          </div>
          <div class="action-row">
            <button id="download-decoded-btn" class="btn primary" style="display: none;">복원 파일 다운로드</button>
            <button id="clear-mem-btn" class="btn secondary">메모리 즉시 파기 (Wipe)</button>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
